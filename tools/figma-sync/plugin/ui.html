<style>
  body { font: 12px/1.5 Inter, system-ui, sans-serif; margin: 0; padding: 16px; color: #1f2329; }
  h1 { font-size: 13px; margin: 0 0 2px; }
  p.sub { margin: 0 0 14px; color: #6c737a; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid #cbced1; border-radius: 4px; }
  textarea { height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  button { margin-top: 14px; width: 100%; padding: 9px; border: 0; border-radius: 4px; background: #156ff5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { background: #cbced1; cursor: default; }
  pre { background: #f7f8fa; border: 1px solid #ebecef; border-radius: 4px; padding: 8px; margin-top: 14px; max-height: 200px; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: pre-wrap; }
  .err { color: #ec0d2a; }
  .ok { color: #148660; }
</style>

<h1>Fuselage Sync</h1>
<p class="sub">Applies the component spec generated by CI from Storybook.</p>

<label for="url">Spec URL</label>
<input id="url" value="https://rocketchat.github.io/fuselage/figma-spec.json" />

<label for="json">…or paste figma-spec.json</label>
<textarea id="json" placeholder="{ &quot;components&quot;: [ … ] }"></textarea>

<button id="go">Sync</button>
<pre id="out">Token collections must already exist in this file.</pre>

<script>
  const out = document.getElementById('out');
  const go = document.getElementById('go');

  go.onclick = () => {
    const json = document.getElementById('json').value.trim();
    const url = document.getElementById('url').value.trim();
    go.disabled = true;
    out.textContent = 'syncing…';
    out.className = '';
    parent.postMessage({ pluginMessage: { type: 'sync', url: json ? null : url, json: json || null } }, '*');
  };

  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    go.disabled = false;
    if (m.type === 'done') {
      out.className = 'ok';
      out.textContent = m.results.join('\n') + (m.log.length ? '\n\n' + m.log.join('\n') : '');
    } else if (m.type === 'error') {
      out.className = 'err';
      out.textContent = m.message + (m.log && m.log.length ? '\n\n' + m.log.join('\n') : '');
    }
  };
</script>
